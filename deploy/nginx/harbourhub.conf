# /etc/nginx/sites-available/harbourhub on the production host.
#
# The certificate paths, the Certbot "managed by Certbot" lines, and the
# server_name are production-specific. Re-running `certbot` rewrites this file,
# so diff it against this copy afterwards and restore the per-request S3
# resolver block if Certbot dropped it.
#
# Why the S3 locations look the way they do: nginx resolves a hostname in
# proxy_pass once, at startup. If that lookup fails - which it did on
# 2026-11-04 and again on 2026-11-13 while unattended-upgrades was replacing
# libc/systemd - nginx refuses to start at all. Using a variable plus an
# explicit resolver defers the lookup to request time, so a DNS blip can no
# longer keep the whole API offline. See docs/ops/service-availability.md.

server {
    server_name api.harbourhubglobal.com;
    client_max_body_size 100M;

    location / {
        proxy_pass http://unix:/run/harbourhub/harbourhub.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Resolve the S3 host per request, not at startup.
    resolver 127.0.0.53 valid=30s ipv6=off;
    resolver_timeout 5s;
    set $s3_storage "harbour-hub-storage.s3.eu-north-1.amazonaws.com";

    location /static/ {
        proxy_pass https://$s3_storage$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host $s3_storage;
    }

    location /media/ {
        proxy_pass https://$s3_storage$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host $s3_storage;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.harbourhubglobal.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.harbourhubglobal.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.harbourhubglobal.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.harbourhubglobal.com;
    return 404; # managed by Certbot
}
