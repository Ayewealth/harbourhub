[Unit]
# Ten starts in five minutes covers a crash loop without letting a broken
# config spin forever. Combined with Restart=always this keeps nginx up.
StartLimitIntervalSec=300
StartLimitBurst=10

[Service]
# Ubuntu ships nginx with Restart=no, so a failed start (for example a DNS
# failure during an unattended upgrade) leaves the site down indefinitely.
Restart=always
RestartSec=5
