name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: harbour_hub
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/harbour_hub
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-key
      DEBUG: "False"
      PAYSTACK_SECRET_KEY: sk_test_ci
      PAYSTACK_PUBLIC_KEY: pk_test_ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Undefined names, unused imports, and unused locals.
      - run: flake8 apps hb --select=F401,F821,F841 --exclude=migrations
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - name: OpenAPI schema
        run: python manage.py spectacular --file schema.yml --validate
      - run: pytest -q
