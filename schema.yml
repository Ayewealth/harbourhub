openapi: 3.0.3
info:
  title: Harbour Hub API
  version: v1
  description: Oil & Gas / Marine Equipment Marketplace API
paths:
  /admin-panel/activity/:
    get:
      operationId: admin_panel_activity_list
      description: Admin view of platform activity logs.
      parameters:
      - in: query
        name: action_type
        schema:
          type: string
          enum:
          - admin_activated
          - admin_invited
          - admin_revoked
          - bulk_action_performed
          - content_dismissed
          - content_resolved
          - content_reviewed
          - listing_archived
          - listing_featured
          - listing_published
          - listing_removed
          - report_submitted
          - roles_matrix_updated
          - user_banned
          - user_rejected
          - user_unbanned
          - user_verified
          - verification_approved
          - verification_rejected
        description: |-
          * `content_reviewed` - Content Reviewed
          * `content_resolved` - Content Resolved
          * `content_dismissed` - Content Dismissed
          * `report_submitted` - Report Submitted
          * `user_verified` - User Verified
          * `user_rejected` - User Rejected
          * `user_banned` - User Banned
          * `user_unbanned` - User Unbanned
          * `admin_invited` - Admin Invited
          * `admin_revoked` - Admin Revoked
          * `admin_activated` - Admin Activated
          * `listing_published` - Listing Published
          * `listing_archived` - Listing Archived
          * `listing_removed` - Listing Removed
          * `listing_featured` - Listing Featured
          * `bulk_action_performed` - Bulk Action Performed
          * `roles_matrix_updated` - Roles Matrix Updated
          * `verification_approved` - Verification Approved
          * `verification_rejected` - Verification Rejected
      - in: query
        name: admin_user
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - admin-panel
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminActionLogList'
          description: ''
  /admin-panel/activity/{id}/:
    get:
      operationId: admin_panel_activity_retrieve
      description: Admin view of platform activity logs.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this admin action log.
        required: true
      tags:
      - admin-panel
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminActionLog'
          description: ''
  /admin-panel/analytics/export/:
    get:
      operationId: admin_panel_analytics_export_retrieve
      description: Returns a CSV/XLSX file of platform analytics.
      summary: Export analytics data
      tags:
      - admin-panel
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: ''
  /admin-panel/careers/:
    get:
      operationId: admin_panel_careers_list
      description: Admin management viewset for Job Listings.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - admin-panel
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJobListingList'
          description: ''
    post:
      operationId: admin_panel_careers_create
      description: Admin management viewset for Job Listings.
      tags:
      - admin-panel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobListingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JobListingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JobListingRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListing'
          description: ''
  /admin-panel/careers/{id}/:
    get:
      operationId: admin_panel_careers_retrieve
      description: Admin management viewset for Job Listings.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this job listing.
        required: true
      tags:
      - admin-panel
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListing'
          description: ''
    put:
      operationId: admin_panel_careers_update
      description: Admin management viewset for Job Listings.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this job listing.
        required: true
      tags:
      - admin-panel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobListingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JobListingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JobListingRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListing'
          description: ''
    patch:
      operationId: admin_panel_careers_partial_update
      description: Admin management viewset for Job Listings.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this job listing.
        required: true
      tags:
      - admin-panel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedJobListingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedJobListingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedJobListingRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListing'
          description: ''
    delete:
      operationId: admin_panel_careers_destroy
      description: Admin management viewset for Job Listings.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this job listing.
        required: true
      tags:
      - admin-panel
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /admin-panel/conversations/:
    get:
