  /admin-panel/orders/stats/:
    get:
      operationId: admin_panel_orders_stats_retrieve
      description: Returns Total Orders, Active Orders, Pending Quote Requests, and
        Completed Transactions — each with a percentage change vs the previous equivalent
        period. Filter using `date_from` and `date_to` (YYYY-MM-DD). Defaults to the
        current calendar month vs the previous month.
      summary: Order statistics for dashboard cards
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: Start of the period (YYYY-MM-DD)
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: End of the period (YYYY-MM-DD)
      tags:
      - admin-panel
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderList'
          description: ''
  /admin-panel/payments/:
    get:
      operationId: admin_panel_payments_list
      description: Admin view of all payments/transactions.
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      tags:
      - admin-panel
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPaymentList'
          description: ''
  /admin-panel/payments/payouts/{id}/mark-paid/:
    post:
      operationId: admin_panel_payments_payouts_mark_paid_create
      description: Admin manually marks a payout as paid.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
