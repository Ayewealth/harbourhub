      - available_at
      - commission_amount
      - commission_rate
      - created_at
      - currency
      - earning_type
      - gross_amount
      - id
      - listing
      - listing_category
      - listing_thumbnail
      - listing_title
      - net_amount
      - order
      - order_number
      - status
    VendorEarningStatusEnum:
      enum:
      - pending
      - available
      - processing
      - paid_out
      - reversed
      type: string
      description: |-
        * `pending` - Pending
        * `available` - Available
        * `processing` - Processing Payout
        * `paid_out` - Paid Out
        * `reversed` - Reversed
    VendorWallet:
      type: object
      description: |-
        Mixin for DRF Serializers to dynamically convert specified list of NGN monetary fields.
        Appends root 'currency' and 'currency_symbol' context.
      properties:
        id:
          type: integer
          readOnly: true
        pending_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        available_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        total_withdrawn:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        currency:
          type: string
          maxLength: 3
        updated_at:
          type: string
          format: date-time
          readOnly: true
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/WalletTransaction'
          readOnly: true
      required:
      - id
      - transactions
      - updated_at
    VerificationRequest:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user_email:
          type: string
          format: email
          readOnly: true
        reviewed_by_email:
          type: string
          format: email
          readOnly: true
        business_license:
          type: string
          nullable: true
          readOnly: true
        government_id:
          type: string
          nullable: true
          readOnly: true
        insurance_certificate:
          type: string
          nullable: true
          readOnly: true
        company_name:
          type: string
          maxLength: 200
        certifications:
          type: string
          description: Industry certifications and qualifications
        references:
          type: string
          description: Business references
        additional_info:
          type: string
          description: Additional information
        status:
          allOf:
          - $ref: '#/components/schemas/VerificationRequestStatusEnum'
          readOnly: true
        admin_notes:
          type: string
          description: Admin review notes
        created_at:
          type: string
          format: date-time
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        user:
          type: integer
          readOnly: true
        reviewed_by:
          type: integer
          nullable: true
      required:
      - business_license
      - company_name
      - created_at
      - government_id
      - id
      - insurance_certificate
      - reviewed_at
      - reviewed_by_email
      - status
      - user
      - user_email
    VerificationRequestRequest:
      type: object
      properties:
        company_name:
          type: string
          minLength: 1
          maxLength: 200
        certifications:
          type: string
          description: Industry certifications and qualifications
        references:
          type: string
          description: Business references
        additional_info:
          type: string
          description: Additional information
        admin_notes:
          type: string
          description: Admin review notes
        reviewed_by:
          type: integer
          nullable: true
      required:
      - company_name
    VerificationRequestStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      - requires_more_info
      type: string
      description: |-
        * `pending` - Pending Review
        * `approved` - Approved
        * `rejected` - Rejected
        * `requires_more_info` - Requires More Information
    VerifyDocumentRequest:
      type: object
      properties:
        is_verified:
          type: boolean
        admin_notes:
          type: string
      required:
      - is_verified
    VerifyDocumentResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    WalletTransaction:
      type: object
      description: |-
        Mixin for DRF Serializers to dynamically convert specified list of NGN monetary fields.
        Appends root 'currency' and 'currency_symbol' context.
      properties:
        id:
          type: integer
          readOnly: true
        transaction_type:
          $ref: '#/components/schemas/TransactionTypeEnum'
        transaction_type_display:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        description:
          type: string
          maxLength: 255
        reference_id:
          type: string
          description: ID of the related object (Order, Payout, etc.)
          maxLength: 100
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - description
      - id
      - transaction_type
      - transaction_type_display
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
