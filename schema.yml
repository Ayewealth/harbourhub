      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedListingListList'
          description: ''
  /admin-panel/listings/{id}/{action}/:
    post:
      operationId: admin_panel_listings_create
      description: Approve, reject, or deactivate a listing.
      parameters:
      - in: path
        name: action
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin-panel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminListingActionRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminListingActionRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminListingActionRequestRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListingActionResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListingActionError'
          description: ''
  /admin-panel/orders/:
    get:
      operationId: admin_panel_orders_list
      description: Admin view of all platform orders.
      parameters:
      - in: query
        name: buyer
        schema:
          type: number
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: order_type
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: seller
        schema:
          type: number
      - in: query
        name: status
        schema:
          type: string
      tags:
      - admin-panel
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminOrderListList'
          description: ''
  /admin-panel/orders/{pk_or_num}/tracking/:
    get:
      operationId: admin_panel_orders_tracking_retrieve
      description: Admin-only order tracking detail view with escrow and dispute highlights.
      parameters:
      - in: path
