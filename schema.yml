      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserListList'
          description: ''
  /admin-panel/dashboard/admins/{id}/edit/:
    patch:
      operationId: admin_panel_dashboard_admins_edit_partial_update
      description: Edit admin role or disable/enable an admin.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin-panel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserEditRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserEditRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserEditRequestRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserEditResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserEditError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserEditNotFound'
          description: ''
    delete:
      operationId: admin_panel_dashboard_admins_edit_destroy
      description: Permanently remove an admin.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin-panel
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDeleteResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDeleteNotFound'
          description: ''
  /admin-panel/dashboard/admins/{id}/revoke/:
    post:
      operationId: admin_panel_dashboard_admins_revoke_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin-panel
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeAdminResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeAdminError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeAdminNotFound'
          description: ''
  /admin-panel/dashboard/config/:
    get:
      operationId: admin_panel_dashboard_config_retrieve
      tags:
      - admin-panel
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformConfig'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformConfigError'
          description: ''
    patch:
      operationId: admin_panel_dashboard_config_partial_update
      tags:
      - admin-panel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPlatformConfigRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPlatformConfigRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPlatformConfigRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformConfig'
          description: ''
  /admin-panel/dashboard/invite/:
    post:
      operationId: admin_panel_dashboard_invite_create
      description: "\nInvite a new or existing user as a dashboard admin.\n\n**Available\
        \ staff roles:**\n| Role | Description |\n|------|-------------|\n| `super_admin`\
        \ | Full access to everything |\n| `operations_admin` | Manages listings and\
        \ orders |\n| `finance_admin` | Manages payments and finance |\n| `support_admin`\
        \ | Handles support and vendors |\n| `compliance_admin` | Manages compliance\
        \ and contracts |\n| `read_only` | View-only access to dashboard |\n     \
        \   "
      summary: Invite dashboard admin
      tags:
      - admin-panel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteAdminRequest'
            examples:
              SupportAdminInvite:
                value:
                  full_name: Jane Smith
                  email: jane@harbourhub.com
                  staff_role: support_admin
                summary: Support Admin Invite
              FinanceAdminInvite:
                value:
                  full_name: John Doe
                  email: john@harbourhub.com
                  staff_role: finance_admin
                summary: Finance Admin Invite
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InviteAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InviteAdminRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteAdminResponse'
              examples:
                SupportAdminInvite:
                  value:
                    full_name: Jane Smith
                    email: jane@harbourhub.com
                    staff_role: support_admin
                  summary: Support Admin Invite
                FinanceAdminInvite:
                  value:
                    full_name: John Doe
                    email: john@harbourhub.com
                    staff_role: finance_admin
                  summary: Finance Admin Invite
          description: ''
  /admin-panel/dashboard/matrix/:
    get:
      operationId: admin_panel_dashboard_matrix_retrieve
      description: "\nBulk update the roles & permissions matrix.\n\n**Available roles:**\
        \ `super_admin`, `operations_admin`, `finance_admin`, `support_admin`, `compliance_admin`,\
        \ `read_only`\n\n**Available modules:** `overview_dashboard`, `listings_management`,\
        \ `orders_bookings`, `vendors_onboarding`, `payments_finance`, `compliance_contracts`,\
        \ `supports`, `analytics`, `messages_monitoring`, `careers`, `users_management`\n\
        \nEach entry needs both `view` and `manage` booleans:\n```json\n{\n  \"matrix\"\
        : {\n    \"support_admin\": {\n      \"listings_management\": { \"view\":\
        \ true, \"manage\": false },\n      \"supports\": { \"view\": true, \"manage\"\
        : true }\n    }\n  }\n}\n```\n        "
      summary: Update roles & permissions matrix
      tags:
      - admin-panel
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolesMatrixGetResponse'
          description: ''
    put:
      operationId: admin_panel_dashboard_matrix_update
      description: GET default matrix from DB; PUT bulk-update (super admin / matrix
        editor).
      summary: Update roles & permissions matrix
      tags:
      - admin-panel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolesMatrixRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RolesMatrixRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RolesMatrixRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolesMatrixPutResponse'
          description: ''
  /admin-panel/dashboard/me/permissions/:
    get:
      operationId: admin_panel_dashboard_me_permissions_retrieve
      description: Effective permissions for the logged-in dashboard user.
      summary: Current admin dashboard permissions
      tags:
      - admin-panel
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardPermissionsResponse'
          description: ''
  /admin-panel/listings/:
    get:
      operationId: admin_panel_listings_list
      description: Admin view of all listings.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
