    get:
      operationId: notifications_list
      description: List notifications for the authenticated user.
      parameters:
      - in: query
        name: is_read
        schema:
          type: boolean
      - in: query
        name: notification_type
        schema:
          type: string
          enum:
          - inquiry_replied
          - listing_approved
          - listing_rejected
          - new_inquiry
          - new_message
          - new_review
          - order_cancelled
          - order_completed
          - order_delivered
          - order_paid
          - order_placed
          - order_shipped
          - payment_failed
          - payment_success
          - payout_failed
          - payout_processed
          - quote_cancelled
          - quote_converted
          - quote_received
          - quote_responded
          - rental_extended
          - rental_reminder
          - store_verified
          - verification_approved
          - verification_rejected
        description: |-
          * `order_placed` - Order Placed
          * `order_paid` - Order Paid
          * `order_shipped` - Order Shipped
          * `order_delivered` - Order Delivered
          * `order_cancelled` - Order Cancelled
          * `order_completed` - Order Completed
          * `quote_received` - Quote Received
          * `quote_responded` - Quote Responded
          * `quote_cancelled` - Quote Cancelled
          * `quote_converted` - Quote Converted
          * `new_message` - New Message
          * `new_inquiry` - New Inquiry
          * `inquiry_replied` - Inquiry Replied
          * `new_review` - New Review
          * `payment_success` - Payment Successful
          * `payment_failed` - Payment Failed
          * `payout_processed` - Payout Processed
          * `payout_failed` - Payout Failed
          * `listing_approved` - Listing Approved
          * `listing_rejected` - Listing Rejected
          * `store_verified` - Store Verified
          * `verification_approved` - Verification Approved
          * `verification_rejected` - Verification Rejected
          * `rental_reminder` - Rental Reminder
          * `rental_extended` - Rental Extended
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - high
          - low
          - medium
        description: |-
          * `low` - Low
          * `medium` - Medium
          * `high` - High
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
