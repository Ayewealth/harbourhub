  /admin-panel/orders/{id}/:
    get:
      operationId: admin_panel_orders_retrieve
      description: Admin view of all platform orders.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this order.
        required: true
      tags:
      - admin-panel
      security:
      - jwtAuth: []
