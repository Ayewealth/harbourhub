      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminConversationListList'
          description: ''
  /admin-panel/conversations/{id}/messages/:
    get:
      operationId: admin_panel_conversations_messages_list
      description: Returns the full paginated, chronologically ordered message history
        for a specific conversation.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - admin-panel
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminMessageList'
          description: ''
  /admin-panel/dashboard/accept-invite/:
    post:
      operationId: admin_panel_dashboard_accept_invite_create
      description: Invited admin sets their password and activates their account.
      summary: Accept admin invite
      tags:
      - admin-panel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptAdminInviteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcceptAdminInviteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcceptAdminInviteRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptAdminInviteResponse'
          description: ''
  /admin-panel/dashboard/admins/:
    get:
      operationId: admin_panel_dashboard_admins_list
      description: Staff users with an AdminProfile (invited admins).
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
