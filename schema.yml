      - order_confirmed
      - item_dispatched
      - in_transit
      - delivered
      - active_hire
      - hire_ended
      - item_returned
      - fulfilled
      - cancelled
      type: string
      description: |-
        * `draft` - Draft
        * `pending_payment` - Pending payment
        * `paid` - Paid
        * `order_confirmed` - Order Confirmed
        * `item_dispatched` - Item Dispatched
        * `in_transit` - In Transit
        * `delivered` - Delivered
        * `active_hire` - Active Hire
        * `hire_ended` - Hire Ended
        * `item_returned` - Item Returned
        * `fulfilled` - Fulfilled
        * `cancelled` - Cancelled
    OrderTrackingDetail:
      type: object
      description: |-
        Mixin for DRF Serializers to dynamically convert specified list of NGN monetary fields.
        Appends root 'currency' and 'currency_symbol' context.
      properties:
        order_id:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatusEnum'
        order_type:
          $ref: '#/components/schemas/OrderTypeEnum'
        listing_title:
          type: string
          default: ''
        buyer:
          allOf:
          - $ref: '#/components/schemas/OrderBuyer'
          readOnly: true
        seller:
          allOf:
          - $ref: '#/components/schemas/OrderSeller'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        estimated_delivery:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        rental_start:
          type: string
          format: date
          nullable: true
        rental_end:
          type: string
          format: date
          nullable: true
        rental_duration:
          type: integer
          readOnly: true
          nullable: true
        dispute:
          allOf:
          - $ref: '#/components/schemas/OrderDispute'
          nullable: true
          readOnly: true
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/OrderTrackingTimeline'
          readOnly: true
        tracking_id:
          type: string
          maxLength: 100
        delivery_carrier:
          type: string
          maxLength: 100
        carrier:
          type: string
          readOnly: true
      required:
      - buyer
      - carrier
      - created_at
      - dispute
      - estimated_delivery
      - order_id
      - order_type
      - rental_duration
      - rental_end
      - rental_start
      - seller
      - timeline
    OrderTrackingDetailRequest:
      type: object
      description: |-
        Mixin for DRF Serializers to dynamically convert specified list of NGN monetary fields.
        Appends root 'currency' and 'currency_symbol' context.
      properties:
        order_id:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/OrderStatusEnum'
        order_type:
          $ref: '#/components/schemas/OrderTypeEnum'
        listing_title:
          type: string
          minLength: 1
          default: ''
        rental_start:
          type: string
          format: date
          nullable: true
        rental_end:
          type: string
          format: date
          nullable: true
        tracking_id:
          type: string
          maxLength: 100
        delivery_carrier:
          type: string
          maxLength: 100
